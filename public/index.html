<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Manager - NestJS + Prisma + PostgreSQL</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success-bg: #ecfdf5;
      --success-text: #065f46;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--success-bg);
      color: var(--success-text);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .stat-label {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .section-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 600;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text);
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      flex: 1;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-sm {
      min-height: 36px;
      padding: 0 12px;
      font-size: 0.82rem;
    }
    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: #fecaca;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .filters input { flex: 1; min-width: 180px; }
    .filters select { width: 200px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }
    .row-actions {
      display: flex;
      gap: 6px;
    }
    .status-msg {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--success-text);
      min-height: 20px;
    }
    .status-msg.error { color: var(--danger); }
    .mobile-cards { display: none; }
    .student-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .student-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 6px;
    }
    .student-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    @media (max-width: 820px) {
      .stats-grid { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      .filters select { width: 100%; }
      .table-wrap { display: none; }
      .mobile-cards { display: block; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Student Manager</h1>
        <p class="subtitle">REST API NestJS + PostgreSQL + Prisma ORM</p>
      </div>
      <span class="badge">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"></path>
          <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"></path>
        </svg>
        PostgreSQL Connected
      </span>
    </header>

    <section class="stats-grid" aria-label="Statistik Mahasiswa">
      <div class="card">
        <div class="stat-label">Total Mahasiswa</div>
        <div class="stat-value" id="stat-total">0</div>
      </div>
      <div class="card">
        <div class="stat-label">Rata-rata IPK</div>
        <div class="stat-value" id="stat-gpa">0.00</div>
      </div>
      <div class="card">
        <div class="stat-label">Jumlah Jurusan</div>
        <div class="stat-value" id="stat-majors">0</div>
      </div>
    </section>

    <main class="layout">
      <section class="card">
        <h2 class="section-title" id="form-title">Tambah Mahasiswa</h2>
        <form id="student-form">
          <input type="hidden" id="student-id" />
          <div class="field">
            <label for="nim">NIM</label>
            <input id="nim" required placeholder="2301001" />
          </div>
          <div class="field">
            <label for="name">Nama Lengkap</label>
            <input id="name" required placeholder="Budi Santoso" />
          </div>
          <div class="field">
            <label for="major">Jurusan</label>
            <input id="major" required placeholder="Teknik Informatika" />
          </div>
          <div class="row-2">
            <div class="field">
              <label for="semester">Semester</label>
              <input id="semester" type="number" min="1" max="14" required value="4" />
            </div>
            <div class="field">
              <label for="gpa">IPK</label>
              <input id="gpa" type="number" step="0.01" min="0" max="4" required value="3.50" />
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="btn-primary" id="submit-btn">Simpan</button>
            <button type="button" class="btn-secondary" id="cancel-btn" hidden>Batal</button>
          </div>
          <div id="status-msg" class="status-msg" role="status"></div>
        </form>
      </section>

      <section class="card">
        <h2 class="section-title">Daftar Mahasiswa</h2>
        <div class="filters">
          <input id="search-input" placeholder="Cari NIM atau nama..." />
          <select id="major-filter">
            <option value="">Semua Jurusan</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>NIM</th>
                <th>Nama</th>
                <th>Jurusan</th>
                <th>Smt</th>
                <th>IPK</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <div class="mobile-cards" id="mobile-cards"></div>
      </section>
    </main>
  </div>

  <script>
    const apiBase = '/api/students';
    const form = document.getElementById('student-form');
    const idInput = document.getElementById('student-id');
    const nimInput = document.getElementById('nim');
    const nameInput = document.getElementById('name');
    const majorInput = document.getElementById('major');
    const semesterInput = document.getElementById('semester');
    const gpaInput = document.getElementById('gpa');
    const formTitle = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const statusMsg = document.getElementById('status-msg');
    const searchInput = document.getElementById('search-input');
    const majorFilter = document.getElementById('major-filter');
    const tableBody = document.getElementById('table-body');
    const mobileCards = document.getElementById('mobile-cards');

    function setStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.className = isError ? 'status-msg error' : 'status-msg';
    }

    function resetForm() {
      idInput.value = '';
      form.reset();
      semesterInput.value = '4';
      gpaInput.value = '3.50';
      formTitle.textContent = 'Tambah Mahasiswa';
      submitBtn.textContent = 'Simpan';
      cancelBtn.hidden = true;
    }

    function editStudent(s) {
      idInput.value = s.id;
      nimInput.value = s.nim;
      nameInput.value = s.name;
      majorInput.value = s.major;
      semesterInput.value = s.semester;
      gpaInput.value = s.gpa;
      formTitle.textContent = 'Edit Mahasiswa';
      submitBtn.textContent = 'Perbarui';
      cancelBtn.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteStudent(id) {
      const res = await fetch(`${apiBase}/${id}`, { method: 'DELETE' });
      if (!res.ok) {
        setStatus('Gagal menghapus data', true);
        return;
      }
      setStatus('Data berhasil dihapus');
      await refreshAll();
    }

    async function loadStats() {
      const res = await fetch(`${apiBase}/stats`);
      const stats = await res.json();
      document.getElementById('stat-total').textContent = stats.totalStudents;
      document.getElementById('stat-gpa').textContent = Number(stats.averageGpa).toFixed(2);
      document.getElementById('stat-majors').textContent = stats.byMajor.length;

      const selected = majorFilter.value;
      majorFilter.innerHTML = '<option value="">Semua Jurusan</option>';
      stats.byMajor.forEach((m) => {
        const opt = document.createElement('option');
        opt.value = m.major;
        opt.textContent = `${m.major} (${m.count})`;
        majorFilter.appendChild(opt);
      });
      majorFilter.value = selected;
    }

    async function loadStudents() {
      const params = new URLSearchParams();
      if (majorFilter.value) params.set('major', majorFilter.value);
      if (searchInput.value.trim()) params.set('search', searchInput.value.trim());
      const query = params.toString() ? `?${params.toString()}` : '';
      const res = await fetch(`${apiBase}${query}`);
      const { data } = await res.json();

      tableBody.innerHTML = '';
      mobileCards.innerHTML = '';

      if (data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" style="color:#6b7280;text-align:center;">Belum ada data mahasiswa.</td></tr>';
        mobileCards.innerHTML = '<p style="color:#6b7280;text-align:center;">Belum ada data mahasiswa.</p>';
        return;
      }

      data.forEach((s) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${s.nim}</td>
          <td><strong>${s.name}</strong></td>
          <td>${s.major}</td>
          <td>${s.semester}</td>
          <td>${Number(s.gpa).toFixed(2)}</td>
          <td>
            <div class="row-actions">
              <button type="button" class="btn-secondary btn-sm edit-btn">Edit</button>
              <button type="button" class="btn-danger btn-sm del-btn">Hapus</button>
            </div>
          </td>
        `;
        tr.querySelector('.edit-btn').addEventListener('click', () => editStudent(s));
        tr.querySelector('.del-btn').addEventListener('click', () => deleteStudent(s.id));
        tableBody.appendChild(tr);

        const card = document.createElement('div');
        card.className = 'student-card';
        card.innerHTML = `
          <div class="student-card-head">
            <strong>${s.name}</strong>
            <span>${s.nim}</span>
          </div>
          <div class="student-meta">${s.major} | Semester ${s.semester} | IPK ${Number(s.gpa).toFixed(2)}</div>
          <div class="row-actions">
            <button type="button" class="btn-secondary btn-sm edit-btn" style="flex:1;">Edit</button>
            <button type="button" class="btn-danger btn-sm del-btn" style="flex:1;">Hapus</button>
          </div>
        `;
        card.querySelector('.edit-btn').addEventListener('click', () => editStudent(s));
        card.querySelector('.del-btn').addEventListener('click', () => deleteStudent(s.id));
        mobileCards.appendChild(card);
      });
    }

    async function refreshAll() {
      await Promise.all([loadStats(), loadStudents()]);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        nim: nimInput.value.trim(),
        name: nameInput.value.trim(),
        major: majorInput.value.trim(),
        semester: Number(semesterInput.value),
        gpa: Number(gpaInput.value),
      };
      const id = idInput.value;
      const res = await fetch(id ? `${apiBase}/${id}` : apiBase, {
        method: id ? 'PATCH' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        setStatus(err.message || 'Gagal menyimpan data', true);
        return;
      }
      resetForm();
      setStatus(id ? 'Data berhasil diperbarui' : 'Data berhasil ditambahkan');
      await refreshAll();
    });

    cancelBtn.addEventListener('click', resetForm);
    searchInput.addEventListener('input', loadStudents);
    majorFilter.addEventListener('change', loadStudents);

    refreshAll();
  </script>
</body>
</html>
