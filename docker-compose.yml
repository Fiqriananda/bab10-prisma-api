services:
  postgres:
    image: postgres:16-alpine
    container_name: bab10_prisma_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bab10_students_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bab10_students_db"]
      interval: 3s
      timeout: 3s
      retries: 10
